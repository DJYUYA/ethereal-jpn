 26px;font:500 13px var(--sans);letter-spacing:.06em;cursor:pointer;transition:transform .25s,background .25s}.submit:hover{background:#3b4a3d;transform:translateY(-2px)}.submit:disabled{opacity:.62;cursor:not-allowed}.submit-row{display:flex;justify-content:center;padding-top:5px}.status{margin:20px 0 0;padding:13px 16px;background:#f3f0e7;color:#44483e;font-size:12px}.status[hidden]{display:none}.or{margin:30px 0 0;text-align:center;color:var(--muted);font-size:11px}.instagram{display:flex;width:max-content;margin:14px auto 0;align-items:center;gap:8px;color:var(--forest);font-size:12px;border-bottom:1px solid var(--olive);padding-bottom:3px}.instagram svg{width:19px;height:19px}.footer{background:#222b23;color:#e8e7dc;padding:24px 0;font-size:10px}.footer-inner{display:flex;justify-content:space-between;gap:20px}.footer a{color:#e8e7dc}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}@media(max-width:600px){.wrap{width:calc(100% - 36px)}.header-inner{height:72px}.hero{padding:48px 0}.form-wrap{padding:32px 0 56px}.footer-inner{flex-direction:column;gap:5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}

68%22%2F%3E%3C%2Fsvg%3E");--washi-size:180px 180px}

    .header,.hero,.form-card,.field input,.field select,.field textarea,.form-note,.footer{background-image:var(--washi-grain);background-size:var(--washi-size);background-repeat:repeat}
    .hero{position:relative;overflow:hidden}
    .hero:after{content:"";position:absolute;right:0;bottom:0;width:min(48vw,500px);height:170px;opacity:.28;pointer-events:none;background:var(--mountain-landscape) right bottom/contain no-repeat}
    .hero>.wrap{position:relative;z-index:1}

  <header class="header"><div class="wrap header-inner"><a class="brand" href="./index.html">ETHEREAL<small>自然と文化を、もう一度身近に。</small></a><a class="back" href="./index.html">← サイトに戻る</a></div></header>
  <main>
    <section class="hero"><div class="wrap"><div class="eyebrow">Contact</div><h1>お問い合わせ</h1><p>活動への参加、農業についての情報交換、取材や協働のご相談など、お気軽にご連絡ください。</p></div></section>
    <section class="form-wrap"><div class="wrap"><form class="form-card" id="contact-form">
      <p class="form-intro">下記フォームに必要事項をご入力ください。<span class="required">* 必須項目</span></p>
      <div class="field"><label for="name">お名前<span class="required">必須</span></label><input id="name" name="name" autocomplete="name" placeholder="例）渡邉 友哉" required></div>
      <div class="field"><label for="email">メールアドレス<span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="例）name@example.com" required></div>
      <div class="field"><label for="category">お問い合わせ内容<span class="required">必須</span></label><select id="category" name="category" required><option value="" selected disabled>選択してください</option><option>活動への参加について</option><option>農業についての情報交換</option><option>取材・協働について</option><option>その他</option></select></div>
      <div class="field"><label for="message">メッセージ<span class="required">必須</span></label><textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください。" required></textarea></div>
      <div class="form-note">フォームの送信先はまだ設定されていません。入力内容は送信・保存されません。現在のご連絡はInstagramのDMからお願いします。</div>
      <div class="submit-row"><button class="submit" type="button" disabled>フォーム受付は準備中です</button></div>
      <p class="or">お急ぎの場合はこちらから</p>

    </form></div></section>
