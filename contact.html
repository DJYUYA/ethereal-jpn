  <style>
    :root{--forest:#2c392f;--olive:#737a55;--cream:#f3f0e7;--paper:#faf9f4;--ink:#242720;--muted:#71756c;--line:#d8d7cd;--accent:#8a7355;--serif:'Noto Serif JP',serif;--sans:'DM Sans','Noto Sans JP',sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.8}.wrap{width:min(1120px,calc(100% - 48px));margin:auto}a{color:inherit;text-decoration:none}.header{background:var(--forest);color:var(--cream)}.header-inner{height:82px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:600;letter-spacing:.24em}.brand small{display:block;font-size:8px;letter-spacing:.2em;font-weight:400;margin-top:-3px}.back{font-size:12px;letter-spacing:.05em}.back:hover{color:#d6a76d}.hero{background:var(--cream);padding:64px 0 58px}.eyebrow{color:var(--olive);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.hero h1{font:500 clamp(34px,5vw,54px)/1.4 var(--serif);margin:12px 0}.hero p{font-size:14px;color:var(--muted);margin:0;max-width:650px}.form-wrap{padding:56px 0 84px}.form-card{max-width:780px;margin:auto;background:white;padding:clamp(24px,5vw,54px);border:1px solid var(--line)}.form-intro{font-size:13px;color:var(--muted);margin:0 0 28px}.field{margin-bottom:24px}.field label,.field legend{display:block;font-size:13px;font-weight:600;margin-bottom:8px}.required{color:#9b5946;font-size:10px;margin-left:7px;letter-spacing:.06em}.optional{color:var(--muted);font-size:10px;margin-left:7px;font-weight:400}.field input,.field select,.field textarea{width:100%;border:1px solid #c9c9be;border-radius:0;background:#fdfcf8;padding:13px 14px;font:14px var(--sans);color:var(--ink)}.field input,.field select{height:50px}.field textarea{min-height:180px;resize:vertical;line-height:1.8}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #737a5570;border-color:var(--olive)}.field input::placeholder,.field textarea::placeholder{color:#a3a49b}.form-note{padding:14px 16px;margin:27px 0;background:var(--cream);color:#62665c;font-size:11px;line-height:1.8}.submit{border:1px solid var(--forest);background:var(--forest);color:white;padding:14px 26px;font:500 13px var(--sans);letter-spacing:.06em;cursor:pointer;transition:transform .25s,background .25s}.submit:hover{background:#3b4a3d;transform:translateY(-2px)}.submit:disabled{opacity:.62;cursor:not-allowed}.submit-row{display:flex;justify-content:center;padding-top:5px}.status{margin:20px 0 0;padding:13px 16px;background:#f3f0e7;color:#44483e;font-size:12px}.status[hidden]{display:none}.or{margin:30px 0 0;text-align:center;color:var(--muted);font-size:11px}.instagram{display:flex;width:max-content;margin:14px auto 0;align-items:center;gap:8px;color:var(--forest);font-size:12px;border-bottom:1px solid var(--olive);padding-bottom:3px}.instagram svg{width:19px;height:19px}.footer{background:#222b23;color:#e8e7dc;padding:24px 0;font-size:10px}.footer-inner{display:flex;justify-content:space-between;gap:20px}.footer a{color:#e8e7dc}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}@media(max-width:600px){.wrap{width:calc(100% - 36px)}.header-inner{height:72px}.hero{padding:48px 0}.form-wrap{padding:32px 0 56px}.footer-inner{flex-direction:column;gap:5px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;scroll-behavior:auto!important}}

<body>
  <header class="header"><div class="wrap header-inner"><a class="brand" href="./index.html">ETHEREAL<small>自然と文化を、もう一度身近に。</small></a><a class="back" href="./index.html">← サイトに戻る</a></div></header>
  <main>
    <section class="hero contact-hero mountain-scene mountain-scene--compact"><div class="wrap"><div class="eyebrow">Contact</div><h1>お問い合わせ</h1><p>活動への参加、農業についての情報交換、取材や協働のご相談など、お気軽にご連絡ください。</p></div></section>
    <section class="form-wrap mountain-scene mountain-scene--left mountain-scene--compact"><div class="wrap"><form class="form-card" id="contact-form">
      <p class="form-intro">下記フォームに必要事項をご入力ください。<span class="required">* 必須項目</span></p>
      <div class="field"><label for="name">お名前<span class="required">必須</span></label><input id="name" name="name" autocomplete="name" placeholder="例）渡邉 友哉" required></div>
      <div class="field"><label for="email">メールアドレス<span class="required">必須</span></label><input id="email" name="email" type="email" autocomplete="email" placeholder="例）name@example.com" required></div>
      <div class="field"><label for="category">お問い合わせ内容<span class="required">必須</span></label><select id="category" name="category" required><option value="" selected disabled>選択してください</option><option>活動への参加について</option><option>農業についての情報交換</option><option>取材・協働について</option><option>その他</option></select></div>
      <div class="field"><label for="message">メッセージ<span class="required">必須</span></label><textarea id="message" name="message" placeholder="お問い合わせ内容をご記入ください。" required></textarea></div>
      <div class="form-note">フォームの送信先はまだ設定されていません。入力内容は送信・保存されません。現在のご連絡はInstagramのDMからお願いします。</div>
      <div class="submit-row"><button class="submit" type="button" disabled>フォーム受付は準備中です</button></div>
      <p class="or">お急ぎの場合はこちらから</p>
      <a class="instagram" href="https://www.instagram.com/etherealjpn/?hl=ja" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><defs><linearGradient id="ig" x1="3" y1="21" x2="21" y2="3"><stop stop-color="#FEDA75"/><stop offset=".42" stop-color="#FA7E1E"/><stop offset=".72" stop-color="#D62976"/><stop offset="1" stop-color="#4F5BD5"/></linearGradient></defs><rect x="2.5" y="2.5" width="19" height="19" rx="5.5" stroke="url(#ig)" stroke-width="2"/><circle cx="12" cy="12" r="4.2" stroke="url(#ig)" stroke-width="2"/><circle cx="18" cy="6.4" r="1.2" fill="#D62976"/></svg>Instagramで連絡する</a>
    </form></div></section>
  </main>
